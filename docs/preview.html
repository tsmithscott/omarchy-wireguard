<!doctype html>
<!-- Source for ../preview.png (the Omarchy marketplace thumbnail). Render 1600x900:
     chromium --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1600,900 --screenshot=preview.png docs/preview.html
     panel.png is a 1x crop of the real panel running on example data (documentation IP ranges). -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0d0d0f; --panel: #1c1c1e; --fg: #f5f5f7; --dim: #9a9aa0; --accent: #ff9f0a; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "JetBrainsMono Nerd Font", monospace; color: var(--fg); }
  .grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(255,159,10,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,159,10,.10) 1px, transparent 1px);
    background-size: 40px 40px; background-position: -1px -1px;
    -webkit-mask-image: radial-gradient(ellipse 75% 85% at 62% 50%, #000 30%, transparent 85%);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; left: 820px; top: 0;
    background: radial-gradient(circle, rgba(255,159,10,.24) 0%, rgba(255,159,10,.07) 38%, transparent 68%);
  }
  .glow2 {
    position: absolute; width: 800px; height: 600px; left: -200px; top: 420px;
    background: radial-gradient(circle, rgba(255,159,10,.08) 0%, transparent 65%);
  }
  .copy { position: absolute; left: 150px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .glyph { display: inline-block; width: 150px; text-align: left; font-size: 120px; line-height: 1; color: var(--accent); text-shadow: 0 0 40px rgba(255,159,10,.35); }
  h1 { margin: 0; font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  .sub { margin: 18px 0 0 4px; font-size: 34px; color: var(--dim); letter-spacing: .01em; }
  .tag { margin: 54px 0 0 4px; font-size: 42px; line-height: 1.35; font-weight: 600; }
  .tag b { color: var(--accent); font-weight: 700; }
  .chips { display: flex; flex-wrap: nowrap; gap: 12px; margin: 44px 0 0 4px; }
  .chip { font-size: 22px; padding: 9px 15px; white-space: nowrap; border: 2px solid rgba(255,159,10,.45); background: rgba(28,28,30,.85); color: var(--fg); }
  .shot { position: absolute; left: 1050px; top: 130px; width: 400px; height: 640px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,159,10,.25), 0 0 70px rgba(255,159,10,.18); }
  .shot img { display: block; width: 400px; height: 640px; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="grid"></div>
  <div class="copy">
    <div class="brand"><span class="glyph">󰖂</span><h1>WireGuard</h1></div>
    <div class="sub">for the Omarchy bar</div>
    <div class="tag">Your tunnels, <b>live speed</b><br>and <b>one-click toggles</b>.</div>
    <div class="chips">
      <span class="chip">Throughput graph</span>
      <span class="chip">Split + full tunnels</span>
      <span class="chip">Tunnel DNS</span>
    </div>
  </div>
  <div class="shot"><img src="panel.png" alt=""></div>
</body>
</html>
